services:
  cockroachdb:
    image: cockroachdb/cockroach:v23.2.0
    restart: unless-stopped
    command: start-single-node --insecure --store=type=mem,size=0.25GB
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    expose:
      - "26257"
      - "8080"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8000
      - APP_ENV=production
      - DATABASE_URL=postgresql://root@cockroachdb:26257/defaultdb?sslmode=disable
      - REDIS_URI=redis://redis:6379
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - CLOUDFLARE_TURNSTILE_SECRET_KEY=${CLOUDFLARE_TURNSTILE_SECRET_KEY}
      - EVENTS_QUEUE_USER_ID=${EVENTS_QUEUE_USER_ID}
      - EVENTS_QUEUE_USER_API_KEY=${EVENTS_QUEUE_USER_API_KEY}
    expose:
      - "8000"
    depends_on:
      - cockroachdb
      - redis

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL}
        - NUXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_API_KEY}
        - NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
        - NUXT_PUBLIC_FIREBASE_PROJECT_ID=${GCP_PROJECT_ID}
        - NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
        - NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}
        - NUXT_PUBLIC_FIREBASE_APP_ID=${FIREBASE_APP_ID}
        - NUXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY=${CLOUDFLARE_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    environment:
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      - api

volumes:
  cockroach_data:
  redis_data:
